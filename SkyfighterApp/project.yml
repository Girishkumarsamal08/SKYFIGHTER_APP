name: SkyfighterApp
deploymentTarget:
  iOS: "17.0"

options:
  bundleIdPrefix: com.skyfighter
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1" # iPhone
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  SkyfighterApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/SkyfighterApp
      - path: iOSApp
    info:
      path: iOSApp/Info.plist
      properties:
        CFBundleDisplayName: SKYFIGHTER
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: "SKYFIGHTER requires local network access to communicate directly with the drone's onboard ESP32 Wi-Fi gateway."
        NSLocationWhenInUseUsageDescription: "SKYFIGHTER uses iPhone GPS location to calculate relative bearing, pilot distance, and emergency return-to-pilot vectors."
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
          - ProfileName: MicroGamepad
    settings:
      base:
        PRODUCT_NAME: SkyfighterApp
        PRODUCT_BUNDLE_IDENTIFIER: com.skyfighter.app
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: MV8SMV87FP
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"

  SkyfighterAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/SkyfighterAppTests
    dependencies:
      - target: SkyfighterApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skyfighter.app.tests
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"

schemes:
  SkyfighterApp:
    build:
      targets:
        SkyfighterApp: all
        SkyfighterAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SkyfighterAppTests
